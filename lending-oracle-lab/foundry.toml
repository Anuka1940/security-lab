[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 128
max_test_rejects = 100000

[profile.ci.fuzz]
runs = 512
